name: 缺陷报告
description: 报告一个可以复现的缺陷。安全问题请走 SECURITY.md 里的私下渠道，不要用这个表单。
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        **安全问题请不要用这个表单。** 按 `SECURITY.md` 里写的渠道私下报告。

        填之前请先确认三件事：
        1. `npm run verify` 在你机器上是什么结果（下面有一栏专门问这个）
        2. 你用的是**一次性 profile** 的 Chrome（带独立 `--user-data-dir`），还是日常在用的那个
        3. 日志里的令牌、Cookie、内网地址、绝对路径已经替换掉了

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 一句话说清期望的行为和实际的行为。
      placeholder: |
        期望：browser_tabs 返回两个标签页
        实际：返回一个，另一个没出现
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: |
        尽量给到"照着敲就能重来一遍"的粒度：具体调用的工具名、参数、页面地址（可以是示例站点）。
        如果只在特定页面出现，指出那个页面的特征（单页应用？重定向？iframe？）。
      placeholder: |
        1. Chrome 用 README.md 里的命令启动（--remote-debugging-port=9222 + 独立 --user-data-dir）
        2. MCP 客户端连接后调用 browser_tabs
        3. 同时开着两个标签页，其中一个是 about:blank
    validations:
      required: true

  - type: textarea
    id: verify-output
    attributes:
      label: npm run verify 的结果
      description: |
        贴最后几行即可。**请带上 `# pass N` 和 `# tests M` 这两行**——只有 `# tests` 分不出测试跑没跑，
        `# pass` 才分得出（有一项浏览器专属测试在没有 Chrome 时会跳过，跳过的表现和通过看起来一样）。
      render: text
      placeholder: |
        # tests 220
        # pass 219
        # fail 0
        # skipped 1
    validations:
      required: true

  - type: input
    id: head
    attributes:
      label: 你测的是哪个版本
      description: "`git rev-parse --short HEAD` 的输出，或发布标签。"
      placeholder: "0ef07c2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 只有 Windows 经过验证；选另外两项说明你在做一件没人做过的事，请写详细些。
      options:
        - Windows
        - macOS（未验证平台）
        - Linux（未验证平台）
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: 版本
      description: "`node --version`、`npm --version`、Chrome 版本（chrome://version）。"
      placeholder: "node v22.x · npm 10.x · Chrome 1xx"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或其他信息
      description: |
        **贴之前请脱敏**：令牌、Cookie、`Authorization` 头、内网地址、`%USERPROFILE%` 下的绝对路径、
        从 recon 草稿里复制出来的响应体。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这不是一个安全问题（安全问题按 `SECURITY.md` 私下报告）
          required: true
        - label: 我贴出的日志已经去掉令牌、Cookie 和绝对路径
          required: true
