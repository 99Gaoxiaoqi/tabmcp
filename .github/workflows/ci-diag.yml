name: ci-diag

on:
  push:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: env
        name: environment
        continue-on-error: true
        run: |
          npm --version
          node --version
          npm config get cache
          node -e "console.log('npm_config_cache=' + process.env.npm_config_cache)"
          node -e "console.log('NODE_OPTIONS=' + process.env.NODE_OPTIONS)"
      - id: a
        name: A npm ci
        continue-on-error: true
        run: npm ci --no-audit --no-fund --loglevel verbose
      - id: b
        name: B npm install
        continue-on-error: true
        run: npm install --no-audit --no-fund --loglevel verbose
      - id: c
        name: C npm-cli.js directly
        continue-on-error: true
        run: node "$(npm root -g)\\npm\\bin\\npm-cli.js" ci --no-audit --no-fund
      - name: outcomes
        run: Write-Host "A=${{ steps.a.outcome }} B=${{ steps.b.outcome }} C=${{ steps.c.outcome }}"
